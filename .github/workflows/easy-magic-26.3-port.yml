name: Easy Magic 26.3 Port

on:
  push:
    branches:
      - easy-magic-26.3-port

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test harness
        uses: actions/checkout@v6

      - name: Checkout Easy Magic 26.2 source
        uses: actions/checkout@v6
        with:
          repository: Fuzss/easy-magic
          ref: 26.2.x
          path: easymagic-src

      - name: Checkout Puzzles Lib 26.3 source
        uses: actions/checkout@v6
        with:
          repository: Fuzss/puzzles-lib
          ref: 26.3.x
          path: puzzleslib-src

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Patch current Puzzles Lib 26.3 Block mixin
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("puzzleslib-src/Fabric/src/main/java/fuzs/puzzleslib/fabric/mixin/BlockFabricMixin.java")
          s = p.read_text()
          s = s.replace(
              "public void playerDestroy$0(Level level, Player player, BlockPos pos, BlockState state, @Nullable BlockEntity blockEntity, ItemStack destroyedWith, CallbackInfo callback) {\n"
              "        if (level instanceof ServerLevel) {\n"
              "            this.puzzleslib$capturedExperience = new int[1];\n"
              "        }\n"
              "    }",
              "public void playerDestroy$0(ServerLevel level, ServerPlayer player, BlockPos pos, BlockState state, @Nullable BlockEntity blockEntity, ItemStack destroyedWith, CallbackInfo callback) {\n"
              "        this.puzzleslib$capturedExperience = new int[1];\n"
              "    }"
          )
          s = s.replace(
              "public void playerDestroy$1(Level level, Player player, BlockPos pos, BlockState state, @Nullable BlockEntity blockEntity, ItemStack destroyedWith, CallbackInfo callback) {\n"
              "        if (!(level instanceof ServerLevel serverLevel)) return;\n"
              "        if (!(player instanceof ServerPlayer serverPlayer)) return;",
              "public void playerDestroy$1(ServerLevel serverLevel, ServerPlayer serverPlayer, BlockPos pos, BlockState state, @Nullable BlockEntity blockEntity, ItemStack destroyedWith, CallbackInfo callback) {"
          )
          s = s.replace("import net.minecraft.world.entity.player.Player;\n", "")
          s = s.replace("import net.minecraft.world.level.Level;\n", "")
          p.write_text(s)
          print(p.read_text())

          # Minecraft 26.3 moved the player item-drop implementation away from Player.
          # Easy Magic does not use FabricPlayerEvents.ITEM_TOSS, so remove this stale hook
          # from the compatibility build instead of leaving a crashing mixin injection.
          p = Path("puzzleslib-src/Fabric/src/main/java/fuzs/puzzleslib/fabric/mixin/PlayerFabricMixin.java")
          s = p.read_text()
          start = s.index('    @Inject(method = "drop"')
          end = s.index('    @ModifyReturnValue(method = "getDestroySpeed"', start)
          s = s[:start] + s[end:]
          p.write_text(s)
          print(p.read_text())

          # Minecraft 26.3 adds ServerLevel to LivingEntity#getVisibilityPercent.
          p = Path("puzzleslib-src/Fabric/src/main/java/fuzs/puzzleslib/fabric/mixin/LivingEntityFabricMixin.java")
          s = p.read_text()
          s = s.replace(
              "public double getVisibilityPercent(double visibilityPercent, @Nullable Entity targetingEntity) {",
              "public double getVisibilityPercent(double visibilityPercent, ServerLevel level, @Nullable Entity targetingEntity) {"
          )
          p.write_text(s)
          print(p.read_text())

          # Minecraft 26.3 changed ServerPlayer's internal item drop overload:
          # (ItemStack, boolean, boolean) -> (ItemStack, boolean, Prediction).
          p = Path("puzzleslib-src/Fabric/src/main/java/fuzs/puzzleslib/fabric/mixin/ServerPlayerFabricMixin.java")
          s = p.read_text()
          s = s.replace(
              "Lnet/minecraft/server/level/ServerPlayer;drop(Lnet/minecraft/world/item/ItemStack;ZZ)Lnet/minecraft/world/entity/item/ItemEntity;",
              "Lnet/minecraft/server/level/ServerPlayer;drop(Lnet/minecraft/world/item/ItemStack;ZLnet/minecraft/util/Prediction;)Lnet/minecraft/world/entity/item/ItemEntity;"
          )
          p.write_text(s)
          print(p.read_text())

          # Spectator post-processing internals were removed/refactored in Minecraft 26.3.
          # Easy Magic never uses Puzzles Lib's EntitySpectatorShaders API, so keep this
          # compatibility mixin present but intentionally inert for the Easy Magic runtime build.
          p = Path("puzzleslib-src/Fabric/src/main/java/fuzs/puzzleslib/fabric/mixin/client/GameRendererFabricMixin.java")
          p.write_text(
              "package fuzs.puzzleslib.fabric.mixin.client;\n\n"
              "import net.minecraft.client.renderer.GameRenderer;\n"
              "import org.spongepowered.asm.mixin.Mixin;\n\n"
              "@Mixin(GameRenderer.class)\n"
              "abstract class GameRendererFabricMixin {\n"
              "}\n"
          )
          print(p.read_text())

          # Minecraft 26.3 refactored ScreenEffectRenderer internals. Easy Magic does not
          # use Puzzles Lib's FabricRendererEvents block-overlay hook, so keep this mixin inert.
          p = Path("puzzleslib-src/Fabric/src/main/java/fuzs/puzzleslib/fabric/mixin/client/ScreenEffectRendererFabricMixin.java")
          p.write_text(
              "package fuzs.puzzleslib.fabric.mixin.client;\n\n"
              "import net.minecraft.client.renderer.ScreenEffectRenderer;\n"
              "import org.spongepowered.asm.mixin.Mixin;\n\n"
              "@Mixin(ScreenEffectRenderer.class)\n"
              "abstract class ScreenEffectRendererFabricMixin {\n"
              "}\n"
          )
          print(p.read_text())
          PY

      - name: Remove Puzzles datagen-only APIs not yet ported to 26.3
        shell: bash
        run: |
          rm -f puzzleslib-src/Common/src/main/java/fuzs/puzzleslib/common/api/client/data/v2/AbstractAtlasProvider.java
          rm -f puzzleslib-src/Common/src/main/java/fuzs/puzzleslib/common/api/data/v2/AbstractAdvancementProvider.java
          rm -f puzzleslib-src/Common/src/main/java/fuzs/puzzleslib/common/api/data/v2/AbstractLootProvider.java
          rm -f puzzleslib-src/Common/src/main/java/fuzs/puzzleslib/common/api/client/data/v2/AbstractParticleProvider.java
          rm -f puzzleslib-src/Common/src/main/java/fuzs/puzzleslib/common/api/data/v2/AbstractRecipeProvider.java

      - name: Patch Puzzles runtime APIs not used by Easy Magic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          p = Path("puzzleslib-src/Fabric/src/main/java/fuzs/puzzleslib/fabric/impl/core/FabricCommonProxy.java")
          s = p.read_text()
          s = s.replace("import fuzs.puzzleslib.common.api.data.v2.AbstractRecipeProvider;\n", "")
          start = s.index("    @Override\n    public RecipeOutput getTransformingRecipeOutput")
          end = s.index("    @Override\n    public void synchronizeRecipeSerializer", start)
          replacement = dedent("""
              @Override
              public RecipeOutput getTransformingRecipeOutput(RecipeOutput recipeOutput, UnaryOperator<Recipe<?>> operator) {
                  throw new UnsupportedOperationException("Datagen recipe transforms are unavailable in the 26.3 runtime compatibility build");
              }

              @Override
              public RecipeOutput getRecipeProviderOutput(CachedOutput output, String modId, PackOutput packOutput, HolderLookup.Provider registries, Consumer<CompletableFuture<?>> consumer) {
                  throw new UnsupportedOperationException("Datagen recipe output is unavailable in the 26.3 runtime compatibility build");
              }

              @Override
              public RecipeOutput getThrowingRecipeOutput() {
                  throw new UnsupportedOperationException("Datagen recipe output is unavailable in the 26.3 runtime compatibility build");
              }

          """)
          s = s[:start] + replacement + s[end:]
          p.write_text(s)

          p = Path("puzzleslib-src/Fabric/src/main/java/fuzs/puzzleslib/fabric/impl/core/context/GameplayContentContextFabricImpl.java")
          p.write_text(dedent("""
              package fuzs.puzzleslib.fabric.impl.core.context;

              import fuzs.puzzleslib.common.api.core.v1.context.GameplayContentContext;
              import net.minecraft.core.Holder;
              import net.minecraft.world.level.ItemLike;
              import net.minecraft.world.level.block.Block;
              import org.apache.commons.lang3.math.Fraction;
              import java.util.Objects;

              public final class GameplayContentContextFabricImpl implements GameplayContentContext {
                  @Override public void registerFuel(Holder<? extends ItemLike> fuelItem, Fraction fuelValue) { Objects.requireNonNull(fuelItem); Objects.requireNonNull(fuelValue); }
                  @Override public void registerFlammable(Holder<Block> flammableBlock, int encouragement, int flammability) { Objects.requireNonNull(flammableBlock); }
                  @Override public void registerCompostable(Holder<? extends ItemLike> compostableItem, float compostingChance) { Objects.requireNonNull(compostableItem); }
                  @Override public void registerStrippable(Holder<Block> unstrippedBlock, Holder<Block> strippedBlock) { Objects.requireNonNull(unstrippedBlock); Objects.requireNonNull(strippedBlock); }
                  @Override public void registerFlattenable(Holder<Block> unflattenedBlock, Holder<Block> flattenedBlock) { Objects.requireNonNull(unflattenedBlock); Objects.requireNonNull(flattenedBlock); }
                  @Override public void registerTillable(Holder<Block> untilledBlock, Holder<Block> tilledBlock) { Objects.requireNonNull(untilledBlock); Objects.requireNonNull(tilledBlock); }
                  @Override public void registerOxidizable(Holder<Block> unoxidizedBlock, Holder<Block> oxidizedBlock) { Objects.requireNonNull(unoxidizedBlock); Objects.requireNonNull(oxidizedBlock); }
                  @Override public void registerWaxable(Holder<Block> unwaxedBlock, Holder<Block> waxedBlock) { Objects.requireNonNull(unwaxedBlock); Objects.requireNonNull(waxedBlock); }
              }
          """))

          p = Path("puzzleslib-src/Fabric/src/main/java/fuzs/puzzleslib/fabric/impl/biome/MobSpawnSettingsContextFabric.java")
          p.write_text(dedent("""
              package fuzs.puzzleslib.fabric.impl.biome;

              import com.google.common.collect.ImmutableSet;
              import fuzs.puzzleslib.common.api.biome.v1.MobSpawnSettingsContext;
              import net.fabricmc.fabric.api.biome.v1.BiomeModificationContext;
              import net.minecraft.core.registries.BuiltInRegistries;
              import net.minecraft.util.random.Weighted;
              import net.minecraft.world.entity.EntityType;
              import net.minecraft.world.entity.MobCategory;
              import net.minecraft.world.level.biome.MobSpawnSettings;
              import org.jspecify.annotations.Nullable;
              import java.util.List;
              import java.util.Set;
              import java.util.function.BiPredicate;

              public record MobSpawnSettingsContextFabric(BiomeModificationContext.MobSpawnSettingsContext context) implements MobSpawnSettingsContext {
                  @Override public void setCreatureGenerationProbability(float probability) { this.context.setCreatureGenerationProbability(probability); }
                  @Override public void addSpawn(MobCategory mobCategory, int weight, MobSpawnSettings.SpawnerData spawnerData) { this.context.addSpawn(mobCategory, spawnerData, weight); }
                  @Override public boolean removeSpawns(BiPredicate<MobCategory, MobSpawnSettings.SpawnerData> filter) { return this.context.removeSpawns(filter); }
                  @Override public void setSpawnCost(EntityType<?> entityType, double energyBudget, double charge) { this.context.addMobCharge(entityType, charge, energyBudget); }
                  @Override public boolean clearSpawnCost(EntityType<?> entityType) { this.context.clearMobCharge(entityType); return true; }
                  @Override public List<Weighted<MobSpawnSettings.SpawnerData>> getSpawnerData(MobCategory mobCategory) { return this.context.getMobs(mobCategory); }
                  @Override public Set<EntityType<?>> getEntityTypesWithSpawnCost() { return ImmutableSet.copyOf(BuiltInRegistries.ENTITY_TYPE); }
                  @Override public MobSpawnSettings.@Nullable MobSpawnCost getSpawnCost(EntityType<?> entityType) { return null; }
                  @Override public float getCreatureGenerationProbability() { return 0.0F; }
              }
          """))

          p = Path("puzzleslib-src/Fabric/src/main/java/fuzs/puzzleslib/fabric/impl/core/context/BiomeModificationsContextFabricImpl.java")
          s = p.read_text()
          s = s.replace("new MobSpawnSettingsContextFabric(biome.getMobSettings(),\n                modificationContext.getMobSpawnSettings())",
                        "new MobSpawnSettingsContextFabric(modificationContext.getMobSpawnSettings())")
          p.write_text(s)

          p = Path("puzzleslib-src/Fabric/src/main/java/fuzs/puzzleslib/fabric/impl/core/context/DataPackReloadListenersContextFabricImpl.java")
          s = p.read_text()
          s = s.replace("ResourceReloaderKeys.Server.RECIPES", 'Identifier.withDefaultNamespace("recipes")')
          s = s.replace("ResourceReloaderKeys.Server.ADVANCEMENTS", 'Identifier.withDefaultNamespace("advancements")')
          p.write_text(s)
          PY

      - name: Build latest Puzzles Lib 26.3 Fabric
        working-directory: puzzleslib-src
        run: |
          chmod +x ./gradlew
          ./gradlew :Fabric:clean :Fabric:jar --stacktrace
          find Fabric/build/libs -maxdepth 1 -type f -ls

      - name: Prepare latest Puzzles Lib dependency
        shell: bash
        run: |
          mkdir -p easymagic-src/deps
          jar="$(find puzzleslib-src/Fabric/build/libs -maxdepth 1 -type f -name '*+Fabric.jar' | head -1)"
          if [ -z "$jar" ]; then
            jar="$(find puzzleslib-src/Fabric/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' ! -name '*dev*' | head -1)"
          fi
          test -n "$jar"
          cp "$jar" PuzzlesLib-26.3-Fabric-26.3.0.jar

          # Some unpublished 26.3 builds declare this resource without packaging it.
          if ! unzip -l PuzzlesLib-26.3-Fabric-26.3.0.jar | grep -q 'puzzleslib.classtweaker'; then
            jar uf PuzzlesLib-26.3-Fabric-26.3.0.jar -C puzzleslib-src/Common/src/main/resources puzzleslib.classtweaker
          fi
          unzip -l PuzzlesLib-26.3-Fabric-26.3.0.jar | grep -q 'puzzleslib.classtweaker'

          # Verify every configured Fabric mixin class exists in the jar; fix the known capitalization
          # mismatch only if the generator still emits it.
          python3 - <<'PY'
          import json, zipfile, shutil, tempfile
          from pathlib import Path

          jar = Path("PuzzlesLib-26.3-Fabric-26.3.0.jar")
          with zipfile.ZipFile(jar, "r") as z:
              names = set(z.namelist())
              cfg = json.loads(z.read("puzzleslib.fabric.mixins.json"))
              package = cfg.get("package", "")
              declared = []
              for key in ("mixins", "client", "server"):
                  declared.extend(cfg.get(key, []))
              missing = []
              for mixin in declared:
                  full = (package + "." + mixin).replace(".", "/") + ".class"
                  if full not in names:
                      missing.append(mixin)
              print("Missing configured mixins before patch:", missing)

          if missing == ["EnderManFabricMixin"]:
              with zipfile.ZipFile(jar, "r") as zin:
                  cfg = json.loads(zin.read("puzzleslib.fabric.mixins.json"))
                  for key in ("mixins", "client", "server"):
                      cfg[key] = ["EndermanFabricMixin" if x == "EnderManFabricMixin" else x for x in cfg.get(key, [])]
                  tmp = jar.with_suffix(".tmp.jar")
                  with zipfile.ZipFile(tmp, "w") as zout:
                      for item in zin.infolist():
                          if item.filename == "puzzleslib.fabric.mixins.json":
                              continue
                          zout.writestr(item, zin.read(item.filename))
                      zout.writestr("puzzleslib.fabric.mixins.json", json.dumps(cfg, indent=2))
              tmp.replace(jar)

          with zipfile.ZipFile(jar, "r") as z:
              names = set(z.namelist())
              cfg = json.loads(z.read("puzzleslib.fabric.mixins.json"))
              package = cfg.get("package", "")
              declared = []
              for key in ("mixins", "client", "server"):
                  declared.extend(cfg.get(key, []))
              missing = [
                  m for m in declared
                  if (package + "." + m).replace(".", "/") + ".class" not in names
              ]
              print("Missing configured mixins after patch:", missing)
              if missing:
                  raise SystemExit("Configured Puzzles mixins missing from jar: " + repr(missing))
          PY

          cp PuzzlesLib-26.3-Fabric-26.3.0.jar easymagic-src/deps/puzzleslib-26.3.jar
          unzip -p PuzzlesLib-26.3-Fabric-26.3.0.jar fabric.mod.json | tee puzzleslib-fabric-mod.json
          grep -q '"puzzleslib"' puzzleslib-fabric-mod.json

      - name: Port Easy Magic source/build to Minecraft 26.3
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path("easymagic-src/gradle.properties")
          s = p.read_text()
          s = s.replace("project.libs=26.2-SNAPSHOT", "project.libs=26.3-SNAPSHOT")
          s = s.replace("mod.version=26.2.0", "mod.version=26.3.0")
          p.write_text(s)

          m = Path("easymagic-src/metadata.json")
          data = json.loads(m.read_text())
          data["minecraft"] = "26.3"
          data["mod"]["version"] = "26.3.0"
          m.write_text(json.dumps(data, indent=4) + "\n")

          b = Path("easymagic-src/Fabric/build.gradle.kts")
          s = b.read_text()
          s = s.replace(
              "modApi(sharedLibs.puzzleslib.fabric)",
              'modApi(files("../deps/puzzleslib-26.3.jar"))\n    modApi(sharedLibs.forgeconfigapiport.fabric)'
          )
          b.write_text(s)

          c = Path("easymagic-src/Common/build.gradle.kts")
          s = c.read_text()
          s = s.replace(
              "modCompileOnlyApi(sharedLibs.puzzleslib.common)",
              'compileOnly(files("../deps/puzzleslib-26.3.jar"))'
          )
          c.write_text(s)

          # Minecraft 26.3: BlockEntity.type became private final. Easy Magic intentionally
          # swaps the vanilla enchanting table type for its registered custom type.
          ct = Path("easymagic-src/Common/src/main/resources/easymagic.classtweaker")
          s = ct.read_text()
          if "net/minecraft/world/level/block/entity/BlockEntity   type" not in s:
              s += (
                  "\naccessible  field   net/minecraft/world/level/block/entity/BlockEntity   type   Lnet/minecraft/world/level/block/entity/BlockEntityType;"
                  "\nmutable     field   net/minecraft/world/level/block/entity/BlockEntity   type   Lnet/minecraft/world/level/block/entity/BlockEntityType;\n"
              )
          ct.write_text(s)

          # ResourceKeyHelper was removed from Puzzles Lib 26.3. Inline its vanilla implementation.
          p2 = Path("easymagic-src/Common/src/main/java/fuzs/easymagic/common/client/util/EnchantmentTooltipHelper.java")
          s = p2.read_text()
          s = s.replace("import fuzs.puzzleslib.common.api.init.v3.registry.ResourceKeyHelper;\n", "")
          s = s.replace(
              "return ResourceKeyHelper.getTranslationKey(ModRegistry.ENCHANTING_MENU_TYPE.key()) + \".\" + string;",
              "return Util.makeDescriptionId(Registries.elementsDirPath(ModRegistry.ENCHANTING_MENU_TYPE.key().registryKey()), ModRegistry.ENCHANTING_MENU_TYPE.key().identifier()) + \".\" + string;"
          )
          p2.write_text(s)

          # Minecraft 26.3 inventory/entity mutations now require explicit prediction semantics.
          p2 = Path("easymagic-src/Common/src/main/java/fuzs/easymagic/common/world/inventory/ModEnchantmentMenu.java")
          s = p2.read_text()
          if "import net.minecraft.util.Prediction;" not in s:
              s = s.replace("import net.minecraft.server.level.ServerPlayer;\n", "import net.minecraft.server.level.ServerPlayer;\nimport net.minecraft.util.Prediction;\n")
          s = s.replace(
              "player.getInventory().placeItemBackInInventory(itemStack);",
              "player.getInventory().placeItemBackInInventory(itemStack, Prediction.SERVER_ONLY);"
          )
          s = s.replace(
              "player.drop(itemStack, false);",
              "player.drop(itemStack, false, Prediction.SERVER_ONLY);"
          )
          p2.write_text(s)

          # PoseStack now exposes direct axis rotation helpers instead of mulPose(Quaternionf).
          p2 = Path("easymagic-src/Common/src/main/java/fuzs/easymagic/common/client/renderer/blockentity/ModEnchantTableRenderer.java")
          s = p2.read_text()
          s = s.replace("poseStack.mulPose(Axis.YP.rotationDegrees(horizontalAngle));", "poseStack.rotateDegrees(Axis.YP, horizontalAngle);")
          s = s.replace("poseStack.mulPose(Axis.XP.rotationDegrees(90.0F));", "poseStack.rotateDegrees(Axis.XP, 90.0F);")
          s = s.replace("poseStack.mulPose(Axis.YP.rotation(renderState.time / 20.0F));", "poseStack.rotate(Axis.YP, renderState.time / 20.0F);")
          s = s.replace("poseStack.mulPose(Axis.YP.rotationDegrees(j * angle + renderState.time));", "poseStack.rotateDegrees(Axis.YP, j * angle + renderState.time);")
          s = s.replace(
              "poseStack.mulPose(Axis.YP.rotationDegrees(rotateItems ? renderState.time % 360.0F : 90.0F));",
              "poseStack.rotateDegrees(Axis.YP, rotateItems ? renderState.time % 360.0F : 90.0F);"
          )
          p2.write_text(s)

          print(p.read_text())
          print(b.read_text())
          print(c.read_text())
          print(ct.read_text())
          PY

      - name: Build Fabric Easy Magic
        working-directory: easymagic-src
        run: |
          chmod +x ./gradlew
          ./gradlew :Fabric:clean :Fabric:jar --stacktrace
          find Fabric/build/libs -maxdepth 1 -type f -ls

      - name: Select Easy Magic Fabric jar
        shell: bash
        run: |
          jar="$(find easymagic-src/Fabric/build/libs -maxdepth 1 -type f -name '*+Fabric.jar' | head -1)"
          if [ -z "$jar" ]; then
            jar="$(find easymagic-src/Fabric/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' ! -name '*dev*' | head -1)"
          fi
          test -n "$jar"
          echo "Selected: $jar"
          cp "$jar" EasyMagic-26.3-Fabric-26.3.0.jar
          unzip -p EasyMagic-26.3-Fabric-26.3.0.jar fabric.mod.json | tee easymagic-fabric-mod.json
          grep -q '"easymagic"' easymagic-fabric-mod.json
          grep -q '26.3' easymagic-fabric-mod.json

      - name: Runtime launch smoke test
        working-directory: easymagic-src
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
          Xvfb :99 -screen 0 1280x720x24 +extension GLX +render -noreset > ../xvfb.out 2>&1 &
          xvfb_pid=$!
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export MESA_LOADER_DRIVER_OVERRIDE=llvmpipe
          sleep 2

          set +e
          timeout 120s ./gradlew :Fabric:runClient --stacktrace > ../runclient.out 2>&1
          code=$?
          set -e
          kill "$xvfb_pid" 2>/dev/null || true

          cat ../runclient.out
          log="$(find Fabric/run -path '*/logs/latest.log' -type f | head -1)"
          if [ -z "$log" ]; then
            log="$(find . -path '*/logs/latest.log' -type f | head -1)"
          fi
          test -n "$log"
          cp "$log" ../latest.log
          tail -n 700 ../latest.log

          if [ "$code" -ne 124 ]; then
            echo "Minecraft client exited before smoke-test timeout (exit $code)"
            exit 1
          fi

          if grep -Eiq 'Mixin apply failed|Could not execute entrypoint|NoSuchMethodError|NoClassDefFoundError|ExceptionInInitializerError|VerifyError|ModResolutionException|Crash report saved|Caused by: java.lang.(NoSuch|AbstractMethod)' ../latest.log; then
            echo "Fatal mod/client startup error detected"
            exit 1
          fi

          grep -Eiq 'Minecraft 26\.3|Loading Minecraft 26\.3' ../latest.log
          grep -Eiq 'easy magic|easymagic' ../latest.log
          grep -Eiq 'puzzles lib|puzzleslib' ../latest.log
          grep -Eiq 'forge config api port|forgeconfigapiport' ../latest.log

      - name: Upload port jars
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: EasyMagic-26.3-Fabric
          path: |
            EasyMagic-26.3-Fabric-26.3.0.jar
            PuzzlesLib-26.3-Fabric-26.3.0.jar
            easymagic-fabric-mod.json
            puzzleslib-fabric-mod.json

      - name: Upload runtime logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: EasyMagic-26.3-runtime-logs
          path: |
            latest.log
            runclient.out
            xvfb.out
