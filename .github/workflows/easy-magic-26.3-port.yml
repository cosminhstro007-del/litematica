name: Easy Magic 26.3 Port

on:
  push:
    branches:
      - easy-magic-26.3-port

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test harness
        uses: actions/checkout@v6

      - name: Checkout Easy Magic 26.2 source
        uses: actions/checkout@v6
        with:
          repository: Fuzss/easy-magic
          ref: 26.2.x
          path: easymagic-src

      - name: Checkout Puzzles Lib 26.3 source
        uses: actions/checkout@v6
        with:
          repository: Fuzss/puzzles-lib
          ref: 26.3.x
          path: puzzleslib-src

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Download cached Puzzles Lib 26.3 build
        uses: actions/download-artifact@v6
        with:
          name: EasyMagic-26.3-Fabric
          path: cached-puzzles
          github-token: ${{ github.token }}
          run-id: 35335403936

      - name: Prepare cached Puzzles Lib dependency
        shell: bash
        run: |
          mkdir -p easymagic-src/deps
          jar="$(find cached-puzzles -type f -name 'PuzzlesLib-26.3-Fabric-26.3.0.jar' | head -1)"
          test -n "$jar"
          cp "$jar" PuzzlesLib-26.3-Fabric-26.3.0.jar
          jar uf PuzzlesLib-26.3-Fabric-26.3.0.jar -C puzzleslib-src/Common/src/main/resources puzzleslib.classtweaker
          unzip -l PuzzlesLib-26.3-Fabric-26.3.0.jar | grep -q 'puzzleslib.classtweaker'

          # 26.3 mixin config generator has one capitalization mismatch:
          # config says EnderManFabricMixin, source/class is EndermanFabricMixin.
          rm -rf /tmp/puzzles-mixin-patch
          mkdir -p /tmp/puzzles-mixin-patch
          unzip -p PuzzlesLib-26.3-Fabric-26.3.0.jar puzzleslib.fabric.mixins.json > /tmp/puzzles-mixin-patch/puzzleslib.fabric.mixins.json
          sed -i 's/EnderManFabricMixin/EndermanFabricMixin/g' /tmp/puzzles-mixin-patch/puzzleslib.fabric.mixins.json
          zip -q -d PuzzlesLib-26.3-Fabric-26.3.0.jar puzzleslib.fabric.mixins.json
          (cd /tmp/puzzles-mixin-patch && zip -q "$GITHUB_WORKSPACE/PuzzlesLib-26.3-Fabric-26.3.0.jar" puzzleslib.fabric.mixins.json)
          unzip -p PuzzlesLib-26.3-Fabric-26.3.0.jar puzzleslib.fabric.mixins.json | grep -q 'EndermanFabricMixin'
          ! unzip -p PuzzlesLib-26.3-Fabric-26.3.0.jar puzzleslib.fabric.mixins.json | grep -q 'EnderManFabricMixin'

          cp PuzzlesLib-26.3-Fabric-26.3.0.jar easymagic-src/deps/puzzleslib-26.3.jar
          unzip -p PuzzlesLib-26.3-Fabric-26.3.0.jar fabric.mod.json | tee puzzleslib-fabric-mod.json
          grep -q '"puzzleslib"' puzzleslib-fabric-mod.json

      - name: Port Easy Magic source/build to Minecraft 26.3
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path("easymagic-src/gradle.properties")
          s = p.read_text()
          s = s.replace("project.libs=26.2-SNAPSHOT", "project.libs=26.3-SNAPSHOT")
          s = s.replace("mod.version=26.2.0", "mod.version=26.3.0")
          p.write_text(s)

          m = Path("easymagic-src/metadata.json")
          data = json.loads(m.read_text())
          data["minecraft"] = "26.3"
          data["mod"]["version"] = "26.3.0"
          m.write_text(json.dumps(data, indent=4) + "\n")

          b = Path("easymagic-src/Fabric/build.gradle.kts")
          s = b.read_text()
          s = s.replace(
              "modApi(sharedLibs.puzzleslib.fabric)",
              'modApi(files("../deps/puzzleslib-26.3.jar"))\n    modApi(sharedLibs.forgeconfigapiport.fabric)'
          )
          b.write_text(s)

          c = Path("easymagic-src/Common/build.gradle.kts")
          s = c.read_text()
          s = s.replace(
              "modCompileOnlyApi(sharedLibs.puzzleslib.common)",
              'compileOnly(files("../deps/puzzleslib-26.3.jar"))'
          )
          c.write_text(s)

          # Minecraft 26.3: BlockEntity.type became private final. Easy Magic intentionally
          # swaps the vanilla enchanting table type for its registered custom type.
          ct = Path("easymagic-src/Common/src/main/resources/easymagic.classtweaker")
          s = ct.read_text()
          if "net/minecraft/world/level/block/entity/BlockEntity   type" not in s:
              s += (
                  "\naccessible  field   net/minecraft/world/level/block/entity/BlockEntity   type   Lnet/minecraft/world/level/block/entity/BlockEntityType;"
                  "\nmutable     field   net/minecraft/world/level/block/entity/BlockEntity   type   Lnet/minecraft/world/level/block/entity/BlockEntityType;\n"
              )
          ct.write_text(s)

          # ResourceKeyHelper was removed from Puzzles Lib 26.3. Inline its vanilla implementation.
          p2 = Path("easymagic-src/Common/src/main/java/fuzs/easymagic/common/client/util/EnchantmentTooltipHelper.java")
          s = p2.read_text()
          s = s.replace("import fuzs.puzzleslib.common.api.init.v3.registry.ResourceKeyHelper;\n", "")
          s = s.replace(
              "return ResourceKeyHelper.getTranslationKey(ModRegistry.ENCHANTING_MENU_TYPE.key()) + \".\" + string;",
              "return Util.makeDescriptionId(Registries.elementsDirPath(ModRegistry.ENCHANTING_MENU_TYPE.key().registryKey()), ModRegistry.ENCHANTING_MENU_TYPE.key().identifier()) + \".\" + string;"
          )
          p2.write_text(s)

          # Minecraft 26.3 inventory/entity mutations now require explicit prediction semantics.
          p2 = Path("easymagic-src/Common/src/main/java/fuzs/easymagic/common/world/inventory/ModEnchantmentMenu.java")
          s = p2.read_text()
          if "import net.minecraft.util.Prediction;" not in s:
              s = s.replace("import net.minecraft.server.level.ServerPlayer;\n", "import net.minecraft.server.level.ServerPlayer;\nimport net.minecraft.util.Prediction;\n")
          s = s.replace(
              "player.getInventory().placeItemBackInInventory(itemStack);",
              "player.getInventory().placeItemBackInInventory(itemStack, Prediction.SERVER_ONLY);"
          )
          s = s.replace(
              "player.drop(itemStack, false);",
              "player.drop(itemStack, false, Prediction.SERVER_ONLY);"
          )
          p2.write_text(s)

          # PoseStack now exposes direct axis rotation helpers instead of mulPose(Quaternionf).
          p2 = Path("easymagic-src/Common/src/main/java/fuzs/easymagic/common/client/renderer/blockentity/ModEnchantTableRenderer.java")
          s = p2.read_text()
          s = s.replace("poseStack.mulPose(Axis.YP.rotationDegrees(horizontalAngle));", "poseStack.rotateDegrees(Axis.YP, horizontalAngle);")
          s = s.replace("poseStack.mulPose(Axis.XP.rotationDegrees(90.0F));", "poseStack.rotateDegrees(Axis.XP, 90.0F);")
          s = s.replace("poseStack.mulPose(Axis.YP.rotation(renderState.time / 20.0F));", "poseStack.rotate(Axis.YP, renderState.time / 20.0F);")
          s = s.replace("poseStack.mulPose(Axis.YP.rotationDegrees(j * angle + renderState.time));", "poseStack.rotateDegrees(Axis.YP, j * angle + renderState.time);")
          s = s.replace(
              "poseStack.mulPose(Axis.YP.rotationDegrees(rotateItems ? renderState.time % 360.0F : 90.0F));",
              "poseStack.rotateDegrees(Axis.YP, rotateItems ? renderState.time % 360.0F : 90.0F);"
          )
          p2.write_text(s)

          print(p.read_text())
          print(b.read_text())
          print(c.read_text())
          print(ct.read_text())
          PY

      - name: Build Fabric Easy Magic
        working-directory: easymagic-src
        run: |
          chmod +x ./gradlew
          ./gradlew :Fabric:clean :Fabric:build --stacktrace
          find Fabric/build/libs -maxdepth 1 -type f -ls

      - name: Select Easy Magic Fabric jar
        shell: bash
        run: |
          jar="$(find easymagic-src/Fabric/build/libs -maxdepth 1 -type f -name '*+Fabric.jar' | head -1)"
          if [ -z "$jar" ]; then
            jar="$(find easymagic-src/Fabric/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' ! -name '*dev*' | head -1)"
          fi
          test -n "$jar"
          echo "Selected: $jar"
          cp "$jar" EasyMagic-26.3-Fabric-26.3.0.jar
          unzip -p EasyMagic-26.3-Fabric-26.3.0.jar fabric.mod.json | tee easymagic-fabric-mod.json
          grep -q '"easymagic"' easymagic-fabric-mod.json
          grep -q '26.3' easymagic-fabric-mod.json

      - name: Runtime launch smoke test
        working-directory: easymagic-src
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
          Xvfb :99 -screen 0 1280x720x24 +extension GLX +render -noreset > ../xvfb.out 2>&1 &
          xvfb_pid=$!
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export MESA_LOADER_DRIVER_OVERRIDE=llvmpipe
          sleep 2

          set +e
          timeout 120s ./gradlew :Fabric:runClient --stacktrace > ../runclient.out 2>&1
          code=$?
          set -e
          kill "$xvfb_pid" 2>/dev/null || true

          cat ../runclient.out
          log="$(find Fabric/run -path '*/logs/latest.log' -type f | head -1)"
          if [ -z "$log" ]; then
            log="$(find . -path '*/logs/latest.log' -type f | head -1)"
          fi
          test -n "$log"
          cp "$log" ../latest.log
          tail -n 700 ../latest.log

          if [ "$code" -ne 124 ]; then
            echo "Minecraft client exited before smoke-test timeout (exit $code)"
            exit 1
          fi

          if grep -Eiq 'Mixin apply failed|Could not execute entrypoint|NoSuchMethodError|NoClassDefFoundError|ExceptionInInitializerError|VerifyError|ModResolutionException|Crash report saved|Caused by: java.lang.(NoSuch|AbstractMethod)' ../latest.log; then
            echo "Fatal mod/client startup error detected"
            exit 1
          fi

          grep -Eiq 'Minecraft 26\.3|Loading Minecraft 26\.3' ../latest.log
          grep -Eiq 'easy magic|easymagic' ../latest.log
          grep -Eiq 'puzzles lib|puzzleslib' ../latest.log
          grep -Eiq 'forge config api port|forgeconfigapiport' ../latest.log

      - name: Upload port jars
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: EasyMagic-26.3-Fabric
          path: |
            EasyMagic-26.3-Fabric-26.3.0.jar
            PuzzlesLib-26.3-Fabric-26.3.0.jar
            easymagic-fabric-mod.json
            puzzleslib-fabric-mod.json

      - name: Upload runtime logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: EasyMagic-26.3-runtime-logs
          path: |
            latest.log
            runclient.out
            xvfb.out
