name: Sophisticated 26.3 Fabric Port

on:
  push:
    branches:
      - sophisticated-26.3-fabric-port
  workflow_dispatch:

jobs:
  port-sophisticated-fabric-lib:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout harness
        uses: actions/checkout@v6

      - name: Checkout Sophisticated Fabric Lib dev
        uses: actions/checkout@v6
        with:
          repository: Salandora/SophisticatedFabricLib
          ref: 1.21.1-fabric-dev
          path: sfl-src

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Port build metadata to Minecraft 26.3
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("sfl-src/gradle.properties")
          s = p.read_text()
          replacements = {
              "parchment_minecraft_version=1.21": "parchment_minecraft_version=26.3",
              "parchment_mappings_version=2024.11.10": "parchment_mappings_version=unused",
              "minecraft_version=1.21.1": "minecraft_version=26.3",
              "fabric_version=0.116.12+1.21.1": "fabric_version=0.160.6+26.3",
              "loader_version=0.19.2": "loader_version=0.19.5",
              "energy_version = 4.1.0": "energy_version = 5.0.0",
              "curseforge_minecraft_versions=1.21.1": "curseforge_minecraft_versions=26.3",
              "modrinth_minecraft_versions=1.21.1": "modrinth_minecraft_versions=26.3",
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s)

          aw = Path("sfl-src/src/main/resources/sophisticatedfabriclib.accesswidener")
          aws = aw.read_text()
          aws = aws.replace("accessWidener v2 named", "accessWidener v2 official")
          aw.write_text(aws)
          print("26.3 access widener:")
          print(aw.read_text())

          # Minecraft 26.x renamed ResourceLocation to Identifier in official names.
          java_root = Path("sfl-src/src/main/java")
          changed = 0
          for jp in java_root.rglob("*.java"):
              js = jp.read_text()
              ns = js.replace("net.minecraft.resources.ResourceLocation", "net.minecraft.resources.Identifier")
              ns = ns.replace("ResourceLocation", "Identifier")
              if ns != js:
                  jp.write_text(ns)
                  changed += 1
          print("Identifier migration touched Java files:", changed)

          p = Path("sfl-src/build.gradle")
          p.write_text(r'''plugins {
              id 'net.fabricmc.fabric-loom' version '1.17.+'
              id 'maven-publish'
          }

          repositories {
              mavenCentral()
              maven { url = "https://maven.fabricmc.net/" }
          }

          group = project.maven_group
          version = "${project.minecraft_version}-${project.mod_version}.26.3-port"

          base {
              archivesName = project.mod_id
          }

          loom {
              runtimeOnlyLog4j = true
              accessWidenerPath = file("src/main/resources/${project.mod_id}.accesswidener")

              mods {
                  "${project.mod_id}" {
                      sourceSet sourceSets.main
                  }
              }

              runs {
                  client {
                      client()
                      runDir "run/${project.minecraft_version}"
                  }
                  server {
                      server()
                      runDir "run/${project.minecraft_version}"
                  }
              }
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              implementation "net.fabricmc:fabric-loader:${project.loader_version}"
              implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
              implementation "teamreborn:energy:${project.energy_version}"

              implementation "javax.annotation:javax.annotation-api:1.3.2"
              implementation "com.google.code.findbugs:jsr305:3.0.2"
          }

          processResources {
              inputs.property "version", project.version
              inputs.property "minecraft_version", project.minecraft_version
              inputs.property "loader_version", project.loader_version
              inputs.property "fabric_version", project.fabric_version
              inputs.property "energy_version", project.energy_version
              filteringCharset = "UTF-8"

              filesMatching("fabric.mod.json") {
                  expand "version": inputs.properties.version,
                          "minecraft_version": inputs.properties.minecraft_version,
                          "loader_version": inputs.properties.loader_version,
                          "fabric_version": inputs.properties.fabric_version,
                          "energy_version": inputs.properties.energy_version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              options.encoding = "UTF-8"
              options.release = 25
          }

          java {
              toolchain.languageVersion = JavaLanguageVersion.of(25)
              sourceCompatibility = JavaVersion.VERSION_25
              targetCompatibility = JavaVersion.VERSION_25
              withSourcesJar()
          }

          jar {
              if (file("LICENSE").exists()) {
                  from("LICENSE") {
                      rename { "${it}_${project.mod_id}" }
                  }
              }
          }
          ''')
          # Fabric Renderer API moved under api.client.renderer.v1 in 26.3.
          for java_file in Path("sfl-src/src/main/java").rglob("*.java"):
              text = java_file.read_text()
              new = text.replace(
                  "net.fabricmc.fabric.api.renderer.v1",
                  "net.fabricmc.fabric.api.client.renderer.v1"
              )
              if new != text:
                  java_file.write_text(new)

          print(Path("sfl-src/gradle.properties").read_text())
          print(Path("sfl-src/build.gradle").read_text())
          PY

      - name: Compile Sophisticated Fabric Lib 26.3
        working-directory: sfl-src
        run: |
          chmod +x ./gradlew
          ./gradlew clean compileJava processResources --stacktrace

      - name: Inspect Minecraft 26.3 model API
        if: always()
        shell: bash
        run: |
          jarfile="$(find sfl-src/.gradle ~/.gradle/caches -type f -name '*.jar' 2>/dev/null | grep -E 'minecraft.*26\\.3|26\\.3.*minecraft' | head -1 || true)"
          echo "Minecraft jar: $jarfile"
          if [ -n "$jarfile" ]; then
            echo "=== block/model ==="
            jar tf "$jarfile" | grep -E '^net/minecraft/client/(renderer/block/model|resources/model|renderer/item)/.*\\.class$' | head -1200 || true
            echo "=== spawn ==="
            jar tf "$jarfile" | grep -E '^net/minecraft/world/entity/.*(Spawn|spawn).*\\.class$' | head -300 || true
            echo "=== loot condition ==="
            jar tf "$jarfile" | grep -E '^net/minecraft/world/level/storage/loot/.*(Condition|Predicate|predicate).*\\.class$' | head -300 || true
          fi
      - name: Build Sophisticated Fabric Lib 26.3
        working-directory: sfl-src
        run: |
          ./gradlew build -x test --stacktrace
          find build/libs -maxdepth 1 -type f -ls

      - name: Collect jar
        if: always()
        shell: bash
        run: |
          mkdir -p out
          find sfl-src/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' -exec cp {} out/ \; || true

      - name: Upload Sophisticated Fabric Lib
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: SophisticatedFabricLib-26.3
          path: out/
