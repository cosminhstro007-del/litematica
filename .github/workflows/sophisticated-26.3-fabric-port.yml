name: Sophisticated 26.3 Fabric Port

on:
  push:
    branches:
      - sophisticated-26.3-fabric-port
  workflow_dispatch:

jobs:
  port-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout harness
        uses: actions/checkout@v6

      - name: Checkout Sophisticated Core Fabric dev
        uses: actions/checkout@v6
        with:
          repository: Salandora/SophisticatedCore
          ref: 1.21.x-fabric-dev
          path: core-src

      - name: Checkout Sophisticated Fabric Lib dev
        uses: actions/checkout@v6
        with:
          repository: Salandora/SophisticatedFabricLib
          ref: 1.21.1-fabric-dev
          path: sfl-src

      - name: Checkout Porting Lib transfer reference
        uses: actions/checkout@v6
        with:
          repository: Fabricators-of-Create/Porting-Lib
          ref: 74fe93105b83775d7e2352998ec72e1b8307b2e3
          path: portinglib-src

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Port Core build metadata to Minecraft 26.3
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          wp = Path("core-src/gradle/wrapper/gradle-wrapper.properties")
          ws = wp.read_text()
          ws = re.sub(r'gradle-[0-9.]+-bin[.]zip', 'gradle-9.5.0-bin.zip', ws)
          wp.write_text(ws)

          p = Path("core-src/gradle.properties")
          s = p.read_text()
          replacements = {
              "parchment_minecraft_version=1.21": "parchment_minecraft_version=26.3",
              "parchment_mappings_version=2024.11.10": "parchment_mappings_version=unused",
              "minecraft_version=1.21.1": "minecraft_version=26.3",
              "fabric_version=0.114.0+1.21.1": "fabric_version=0.160.6+26.3",
              "loader_version=0.16.9": "loader_version=0.19.5",
              "mixin_extras_version = 0.5.0-beta.3": "mixin_extras_version = 0.5.5",
              "forge_config_api_port_version = 21.1.3": "forge_config_api_port_version = 26.3.0",
              "energy_version = 4.1.0": "energy_version = 5.0.0",
              "release_versions=1.21.1": "release_versions=26.3",
          }
          for old,new in replacements.items():
              s=s.replace(old,new)
          p.write_text(s)

          p=Path("core-src/build.gradle")
          s=p.read_text()
          s=s.replace("id 'fabric-loom' version '1.10.+'", "id 'net.fabricmc.fabric-loom' version '1.17.+'")
          # Minecraft 26.x is unobfuscated; remove the obsolete Parchment/official mapping block.
          s=re.sub(r'\n\s*mappings\(loom\.layered \{.*?\n\s*\}\)\n', '\n', s, flags=re.S)
          s=s.replace("it.options.release = 21", "it.options.release = 25")
          s=s.replace("sourceCompatibility = JavaVersion.VERSION_21", "sourceCompatibility = JavaVersion.VERSION_25")
          s=s.replace("targetCompatibility = JavaVersion.VERSION_21", "targetCompatibility = JavaVersion.VERSION_25")
          s=s.replace("languageVersion = JavaLanguageVersion.of(21)", "languageVersion = JavaLanguageVersion.of(25)")
          # Minecraft 26.x ships unobfuscated; Loom 1.17 uses plain Gradle dependency configurations.
          for old, new in [
              ("modImplementation", "implementation"),
              ("modApi", "implementation"),
              ("modCompileOnlyApi", "compileOnly"),
              ("modCompileOnly", "compileOnly"),
              ("modLocalRuntime", "runtimeOnly"),
          ]:
              s = s.replace(old, new)

          # Porting Lib has no 26.3 artifacts. Remove dependency loop; target-specific shims are added next.
          s=re.sub(r'\n\s*for \(def module in porting_lib_modules\.split\(\',\'\)\) \{.*?\n\s*\}\n', '\n', s, count=1, flags=re.S)
          # 26.x is unobfuscated, so Loom has no remapJar task; publish the normal jar.
          s = s.replace("remapJar", "jar")

          # Ask javac for the complete migration surface instead of stopping at 100 errors.
          s += "\n\ntasks.withType(JavaCompile).configureEach { options.compilerArgs += ['-Xmaxerrs', '2000'] }\n"
          # Vendor the common/runtime pieces of Sophisticated Fabric Lib.
          import shutil
          sfl_root = Path("sfl-src/src/main/java/com/github/salandora/sophisticatedfabriclib")
          core_sfl_root = Path("core-src/src/main/java/com/github/salandora/sophisticatedfabriclib")
          for rel in ["util", "transfer", "fluid", "energy"]:
              src = sfl_root / rel
              dst = core_sfl_root / rel
              if src.exists():
                  shutil.copytree(src, dst, dirs_exist_ok=True)
          root_bootstrap = sfl_root / "SophisticatedFabricLib.java"
          if root_bootstrap.exists():
              core_sfl_root.mkdir(parents=True, exist_ok=True)
              shutil.copy2(root_bootstrap, core_sfl_root / root_bootstrap.name)

          # Replace Porting Lib APIs that have direct SFL equivalents.
          import_map = {
              "io.github.fabricators_of_create.porting_lib.util.DeferredRegister": "com.github.salandora.sophisticatedfabriclib.util.DeferredRegister",
              "io.github.fabricators_of_create.porting_lib.util.DeferredHolder": "com.github.salandora.sophisticatedfabriclib.util.DeferredHolder",
              "io.github.fabricators_of_create.porting_lib.fluids.BaseFlowingFluid": "com.github.salandora.sophisticatedfabriclib.fluid.api.v1.BaseFlowingFluid",
              "io.github.fabricators_of_create.porting_lib.fluids.FluidStack": "com.github.salandora.sophisticatedfabriclib.fluid.api.v1.FluidStack",
              "io.github.fabricators_of_create.porting_lib.fluids.FluidType": "com.github.salandora.sophisticatedfabriclib.fluid.api.v1.FluidType",
              "io.github.fabricators_of_create.porting_lib.transfer.fluid.SimpleFluidContent": "com.github.salandora.sophisticatedfabriclib.fluid.api.v1.SimpleFluidContent",
              "io.github.fabricators_of_create.porting_lib.transfer.fluid.block.BucketPickupHandlerWrapper": "com.github.salandora.sophisticatedfabriclib.fluid.api.v1.BucketPickupHandlerWrapper",
              "io.github.fabricators_of_create.porting_lib.transfer.item.ItemStackHandler": "com.github.salandora.sophisticatedfabriclib.transfer.api.v1.ItemStackHandler",
              "io.github.fabricators_of_create.porting_lib.transfer.TransferUtil": "com.github.salandora.sophisticatedfabriclib.transfer.api.v1.TransferUtil",
              "io.github.fabricators_of_create.porting_lib.transfer.MutableContainerItemContext": "com.github.salandora.sophisticatedfabriclib.transfer.api.v1.ItemStackContainerItemContext",
          }
          for jf in Path("core-src/src/main/java").rglob("*.java"):
              txt = jf.read_text(errors="ignore")
              new = txt
              for old, repl in import_map.items():
                  new = new.replace(old, repl)
              if new != txt:
                  jf.write_text(new)

          # Datagen classes are not required by the runtime mods.
          data_dir = Path("core-src/src/main/java/net/p3pp3rf1y/sophisticatedcore/data")
          if data_dir.exists():
              shutil.rmtree(data_dir)
          for rel in [
              "net/p3pp3rf1y/sophisticatedcore/crafting/SCShapedRecipeBuilder.java",
              "net/p3pp3rf1y/sophisticatedcore/crafting/SCShapelessRecipeBuilder.java",
              "net/p3pp3rf1y/sophisticatedcore/crafting/ShapelessBasedRecipeBuilder.java",
          ]:
              q = Path("core-src/src/main/java") / rel
              if q.exists():
                  q.unlink()

          # Mojang renamed ResourceLocation to Identifier in 26.x.
          for jf in Path("core-src/src/main/java").rglob("*.java"):
              txt = jf.read_text(errors="ignore")
              new = txt.replace("net.minecraft.resources.ResourceLocation", "net.minecraft.resources.Identifier")
              new = new.replace("ResourceLocation.fromNamespaceAndPath", "Identifier.fromNamespaceAndPath")
              new = new.replace("ResourceLocation.tryParse", "Identifier.tryParse")
              new = new.replace("ResourceLocation.parse", "Identifier.parse")
              new = new.replace("ResourceLocation", "Identifier")
              if new != txt:
                  jf.write_text(new)

          # Minecraft 26.3 uses official/unobfuscated class names. Update Loom injected-interface
          # targets so ItemStack/DataComponentHolder/Slot/etc. expose the Sophisticated helper APIs at compile time.
          fmj = Path("core-src/src/main/resources/fabric.mod.json")
          if fmj.exists():
              fs = fmj.read_text()
              injected_targets = {
                  "net/minecraft/class_465": "net/minecraft/client/gui/screens/inventory/AbstractContainerScreen",
                  "net/minecraft/class_727": "net/minecraft/client/particle/TerrainParticle",
                  "net/minecraft/class_1297": "net/minecraft/world/entity/Entity",
                  "net/minecraft/class_1657": "net/minecraft/world/entity/player/Player",
                  "net/minecraft/class_1735": "net/minecraft/world/inventory/Slot",
                  "net/minecraft/class_1792": "net/minecraft/world/item/Item",
                  "net/minecraft/class_1799": "net/minecraft/world/item/ItemStack",
                  "net/minecraft/class_1937": "net/minecraft/world/level/Level",
                  "net/minecraft/class_2248": "net/minecraft/world/level/block/Block",
                  "net/minecraft/class_2680": "net/minecraft/world/level/block/state/BlockState",
                  "net/minecraft/class_2586": "net/minecraft/world/level/block/entity/BlockEntity",
                  "net/minecraft/class_9322": "net/minecraft/core/component/DataComponentHolder",
                  "net/minecraft/class_9288": "net/minecraft/world/item/component/ItemContainerContents",
              }
              for old, new in injected_targets.items():
                  fs = fs.replace(old, new)
              fmj.write_text(fs)

          # Minecraft 26.3 uses the official/unobfuscated namespace in access wideners.
          aw = Path("core-src/src/main/resources/sophisticatedcore.accesswidener")
          if aw.exists():
              aws = aw.read_text().replace("accessWidener v2 named", "accessWidener v2 official")
              # ItemOverrides was removed by the 26.x item rendering rewrite.
              aws = "\n".join(line for line in aws.splitlines() if "renderer/block/model/ItemOverrides" not in line) + "\n"
              # ShapedRecipe stores its result as ItemStackTemplate in 26.x.
              aws = aws.replace(
                  "accessible field net/minecraft/world/item/crafting/ShapedRecipe result Lnet/minecraft/world/item/ItemStack;",
                  "accessible field net/minecraft/world/item/crafting/ShapedRecipe result Lnet/minecraft/world/item/ItemStackTemplate;"
              )
              aw.write_text(aws)

          # Remove compile-only integrations that have no 26.3 artifacts yet.
          optional_tokens = [
              "dev.emi:", "mezz.jei:", "me.shedaniel:", "cloth-config",
              "curse.maven:jade", "craftingtweaks", "balm-fabric",
              "earth.terrarium.chipped", "maven.modrinth:admiral",
              "simple-voice-chat", "audioplayer", "dev.emi:trinkets"
          ]
          kept = []
          for line in s.splitlines():
              if any(token in line for token in optional_tokens):
                  continue
              kept.append(line)
          s = "\n".join(kept) + "\n"
          p.write_text(s)

          # During the common/server migration pass, exclude 1.21 client-only sources.
          # They are ported in a separate pass after storage/inventory logic compiles.
          s = s.replace("apply from: getProject().file('gradle/package-info.gradle')", "")
          p.write_text(s)

          client_removed = []
          for jf in Path("core-src/src/main/java").rglob("*.java"):
              rel = str(jf).replace("\\\\", "/")
              txt = jf.read_text(errors="ignore")
              client_imports = [
                  line.strip() for line in txt.splitlines()
                  if line.strip().startswith("import net.p3pp3rf1y.sophisticatedcore.client.")
              ]
              only_translation_helper = bool(client_imports) and all(
                  "client.gui.utils.TranslationHelper" in line for line in client_imports
              )
              if (
                  jf.name == "package-info.java"
                  or ("/client/" in rel and not rel.endswith("/client/gui/utils/TranslationHelper.java"))
                  or "import net.minecraft.client." in txt
                  or "import com.mojang.blaze3d." in txt
                  or (client_imports and not only_translation_helper and not rel.endswith("/Config.java"))
              ):
                  client_removed.append(rel)
                  jf.unlink()
          print(f"Removed {len(client_removed)} client/package-info Java files for common migration pass")

          # Config is common/runtime code but references this client-facing enum. Keep a tiny
          # compile/runtime-compatible enum during the common pass; the full client source is restored later.
          sbp = Path("core-src/src/main/java/net/p3pp3rf1y/sophisticatedcore/client/gui/SortButtonsPosition.java")
          sbp.parent.mkdir(parents=True, exist_ok=True)
          sbp.write_text(
              "package net.p3pp3rf1y.sophisticatedcore.client.gui;\n"
              "public enum SortButtonsPosition { TITLE_LINE_RIGHT, TITLE_LINE_LEFT, BELOW_TITLE, HIDDEN }\n"
          )

          # Replace TranslationHelper with a common-safe implementation for the common pass.
          th = Path("core-src/src/main/java/net/p3pp3rf1y/sophisticatedcore/client/gui/utils/TranslationHelper.java")
          th.parent.mkdir(parents=True, exist_ok=True)
          th.write_text(
              "package net.p3pp3rf1y.sophisticatedcore.client.gui.utils;\n\n"
              "import net.minecraft.ChatFormatting;\n"
              "import net.minecraft.network.chat.Component;\n"
              "import net.minecraft.network.chat.MutableComponent;\n"
              "import net.minecraft.world.item.Item;\n"
              "import net.p3pp3rf1y.sophisticatedcore.SophisticatedCore;\n"
              "import net.p3pp3rf1y.sophisticatedcore.util.RegistryHelper;\n"
              "import java.util.List;\n\n"
              "public class TranslationHelper {\n"
              "  public static final String TOOLTIP_SUFFIX = \".tooltip\";\n"
              "  public static final TranslationHelper INSTANCE = new TranslationHelper(SophisticatedCore.MOD_ID);\n"
              "  private final String guiPrefix, guiUpgradePrefix, guiSettingsPrefix, guiStatusPrefix, buttonsPrefix, itemUpgradePrefix, blockPrefix, upgradeGroupPrefix, upgradeButtonsPrefix, upgradeControlsPrefix, keybindPrefix;\n"
              "  public TranslationHelper(String modId) {\n"
              "    guiPrefix=\"gui.\"+modId+\".\"; keybindPrefix=\"keybind.\"+modId+\".\"; itemUpgradePrefix=\"item.\"+modId+\".\"; blockPrefix=\"block.\"+modId+\".\"; upgradeGroupPrefix=\"upgrade_group.\"+modId+\".\"; guiUpgradePrefix=guiPrefix+\"upgrades.\"; guiSettingsPrefix=guiPrefix+\"settings.\"; guiStatusPrefix=guiPrefix+\"status.\"; buttonsPrefix=guiPrefix+\"buttons.\"; upgradeButtonsPrefix=guiUpgradePrefix+\"buttons.\"; upgradeControlsPrefix=guiUpgradePrefix+\"controls.\";\n"
              "  }\n"
              "  public MutableComponent translStatusMessage(String k,Object...p){return Component.translatable(guiStatusPrefix+k,p);}\n"
              "  public MutableComponent translUpgrade(String k,Object...p){return Component.translatable(translUpgradeKey(k),p);}\n"
              "  public Component translUpgradeSlotTooltip(String k){return Component.translatable(guiUpgradePrefix+\"slots.\"+k+TOOLTIP_SUFFIX);}\n"
              "  public String translUpgradeKey(String k){return guiUpgradePrefix+k;}\n"
              "  public String translBlockTooltipKey(String k){return blockPrefix+k+TOOLTIP_SUFFIX;}\n"
              "  public String translSettings(String k){return guiSettingsPrefix+k;}\n"
              "  public String translSettingsButton(String k){return translSettings(\"buttons.\"+k);}\n"
              "  public String translSettingsMessage(String k){return translSettings(\"message.\"+k);}\n"
              "  public Component translUpgradeTooltip(String k){return Component.translatable(translUpgradeKey(k)+TOOLTIP_SUFFIX);}\n"
              "  public String translSettingsTooltip(String k){return translSettings(k)+TOOLTIP_SUFFIX;}\n"
              "  public Component translColoredButton(String k,ChatFormatting c){return Component.translatable(translButton(k)).withStyle(c);}\n"
              "  public String translButton(String k){return buttonsPrefix+k;}\n"
              "  public Component translError(String k,Object...p){return Component.translatable(guiPrefix+\"error.\"+k,p);}\n"
              "  public String translUpgradeGroup(String k){return upgradeGroupPrefix+k;}\n"
              "  public String translUpgradeButton(String k){return upgradeButtonsPrefix+k;}\n"
              "  public String translUpgradeControl(String k){return upgradeControlsPrefix+k;}\n"
              "  public String translItemTooltip(Item i){return translItemTooltip(RegistryHelper.getItemKey(i).getPath());}\n"
              "  public String translItemTooltip(String k){return itemUpgradePrefix+k+TOOLTIP_SUFFIX;}\n"
              "  public List<Component> getTranslatedLines(String k,Object p,ChatFormatting...f){return List.of(Component.translatable(k).withStyle(f));}\n"
              "  public List<Component> getTranslatedLines(String k){return List.of(Component.translatable(k));}\n"
              "  public List<Component> getTranslatedLines(String k,Object p){return List.of(Component.translatable(k,p));}\n"
              "  public String translate(String k,Object...p){return k;}\n"
              "  public String translKeybind(String k){return keybindPrefix+k;}\n"
              "  public String translGui(String k){return guiPrefix+k;}\n"
              "  public String translGuiTooltip(String k){return guiPrefix.substring(0,guiPrefix.length()-1)+TOOLTIP_SUFFIX+\".\"+k;}\n"
              "}\n"
          )

          # Neutralize optional compat registration during the base/common pass.
          mc = Path("core-src/src/main/java/net/p3pp3rf1y/sophisticatedcore/init/ModCompat.java")
          if mc.exists():
              mc.write_text(
                  "package net.p3pp3rf1y.sophisticatedcore.init;\n\n"
                  "public final class ModCompat {\n"
                  "    private ModCompat() {}\n"
                  "    public static void register() {}\n"
                  "}\n"
              )

          # Client model geometry registration is restored in the client port pass.
          sc = Path("core-src/src/main/java/net/p3pp3rf1y/sophisticatedcore/SophisticatedCore.java")
          if sc.exists():
              ss = sc.read_text()
              ss = ss.replace("import fuzs.forgeconfigapiport.fabric.api.neoforge.v4.NeoForgeConfigRegistry;\n", "import fuzs.forgeconfigapiport.fabric.api.v5.ConfigRegistry;\n")
              ss = ss.replace("NeoForgeConfigRegistry.INSTANCE", "ConfigRegistry.INSTANCE")
              ss = ss.replace("import io.github.fabricators_of_create.porting_lib.models.geometry.RegisterGeometryLoadersCallback;\n", "")
              ss = ss.replace("import net.p3pp3rf1y.sophisticatedcore.util.model.DynamicFluidContainerModel;\n", "")
              ss = ss.replace("RegisterGeometryLoadersCallback.EVENT.register(loaders -> loaders.put(SophisticatedCore.getRL(\"fluid_container\"), DynamicFluidContainerModel.Loader.INSTANCE));", "")
              sc.write_text(ss)

          # The old buildSrc processor post-processes remapJar. 26.x is unobfuscated,
          # so post-process the ordinary jar instead.
          dp = Path("core-src/buildSrc/src/main/java/com/github/salandora/sophisticatedcorebuild/processor/DeduplicationProcessor.java")
          if dp.exists():
              ds = dp.read_text().replace('named("remapJar", Jar.class)', 'named("jar", Jar.class)')
              dp.write_text(ds)

          # Drop source files that are purely optional third-party compatibility glue.
          optional_imports = (
              "import mezz.jei.", "import dev.emi.emi.", "import me.shedaniel.rei.",
              "import me.shedaniel.math.", "import earth.terrarium.chipped.",
              "import net.blay09.mods.craftingtweaks.", "import top.theillusivec4.curios.",
              "import dev.emi.trinkets."
          )
          removed = []
          for jf in Path("core-src/src").rglob("*.java"):
              txt = jf.read_text(errors="ignore")
              if any(prefix in txt for prefix in optional_imports):
                  removed.append(str(jf))
                  jf.unlink()
          print("Removed optional compat Java files:")
          print("\n".join(removed))

          print(p.read_text()[:24000])
          print(Path("core-src/gradle.properties").read_text())
          PY

      - name: Patch Core inventory compatibility for 26.3
        run: python3 .github/scripts/port-sophisticated-core-inventory-26.3.py

      - name: Audit Core compatibility imports
        shell: bash
        run: |
          echo "=== Porting Lib imports ==="
          grep -RhoE 'import io[.]github[.]fabricators_of_create[.]porting_lib[^;]*;' core-src/src 2>/dev/null | sort -u || true
          echo "=== Third-party imports ==="
          grep -RhoE '^import (mezz|dev[.]emi|me[.]shedaniel|net[.]blay09|earth[.]terrarium|de[.]maxhenkel|top[.]theillusivec4|io[.]wispforest)[^;]*;' core-src/src 2>/dev/null | sort -u || true

      - name: Compile Sophisticated Core 26.3
        working-directory: core-src
        run: |
          chmod +x ./gradlew
          ./gradlew clean compileJava processResources --stacktrace

      - name: Collect Core jar
        if: always()
        shell: bash
        run: |
          mkdir -p out
          find core-src/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' -exec cp {} out/ \; 2>/dev/null || true

      - name: Upload Core
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: SophisticatedCore-26.3-Fabric
          path: out/
          if-no-files-found: warn
