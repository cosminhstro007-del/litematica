name: Sophisticated 26.3 Fabric Port

on:
  push:
    branches:
      - sophisticated-26.3-fabric-port
  workflow_dispatch:

jobs:
  port-sophisticated-fabric-lib:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout harness
        uses: actions/checkout@v6

      - name: Checkout Sophisticated Fabric Lib dev
        uses: actions/checkout@v6
        with:
          repository: Salandora/SophisticatedFabricLib
          ref: 1.21.1-fabric-dev
          path: sfl-src

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Port build metadata to Minecraft 26.3
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("sfl-src/gradle.properties")
          s = p.read_text()
          replacements = {
              "parchment_minecraft_version=1.21": "parchment_minecraft_version=26.3",
              "parchment_mappings_version=2024.11.10": "parchment_mappings_version=unused",
              "minecraft_version=1.21.1": "minecraft_version=26.3",
              "fabric_version=0.116.12+1.21.1": "fabric_version=0.160.6+26.3",
              "loader_version=0.19.2": "loader_version=0.19.5",
              "energy_version = 4.1.0": "energy_version = 5.0.0",
              "curseforge_minecraft_versions=1.21.1": "curseforge_minecraft_versions=26.3",
              "modrinth_minecraft_versions=1.21.1": "modrinth_minecraft_versions=26.3",
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s)

          p = Path("sfl-src/build.gradle")
          s = p.read_text()
          s = s.replace("id 'fabric-loom' version '1.16.+'", "id 'fabric-loom' version '1.17.+'")
          s = s.replace(
              """mappings(loom.layered {
                  it.officialMojangMappings()
                  it.parchment("org.parchmentmc.data:parchment-${project.parchment_minecraft_version}:${project.parchment_mappings_version}@zip")
              })""",
              ""
          )
          s = s.replace(
              'modImplementation "net.fabricmc.fabric-api:fabric-api:FABRIC_API_VERSION"',
              'modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"'
          )
          s = s.replace("languageVersion = JavaLanguageVersion.of(21)", "languageVersion = JavaLanguageVersion.of(25)")
          s = s.replace("toolchain.languageVersion = JavaLanguageVersion.of(21)", "toolchain.languageVersion = JavaLanguageVersion.of(25)")

          # 26.x Loom no longer exposes the old standalone sponge-mixin artifact this dev-only
          # hotswap block expects. It is irrelevant for CI/runtime builds, so remove it.
          marker_start = "            try {\\n                afterEvaluate {"
          marker_end = "            }\\n        }\\n\\n        server {"
          if marker_start in s:
              start = s.index(marker_start)
              end = s.index(marker_end, start)
              s = s[:start] + "        }\\n\\n        server {" + s[end + len(marker_end):]

          p.write_text(s)

          print(Path("sfl-src/gradle.properties").read_text())
          print(Path("sfl-src/build.gradle").read_text())
          PY

      - name: Compile Sophisticated Fabric Lib 26.3
        working-directory: sfl-src
        run: |
          chmod +x ./gradlew
          ./gradlew clean compileJava processResources --stacktrace

      - name: Build Sophisticated Fabric Lib 26.3
        working-directory: sfl-src
        run: |
          ./gradlew build -x test --stacktrace
          find build/libs -maxdepth 1 -type f -ls

      - name: Collect jar
        if: always()
        shell: bash
        run: |
          mkdir -p out
          find sfl-src/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' -exec cp {} out/ \; || true

      - name: Upload Sophisticated Fabric Lib
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: SophisticatedFabricLib-26.3
          path: out/
