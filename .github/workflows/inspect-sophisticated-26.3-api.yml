name: Inspect MC26.3 APIs for Sophisticated

on:
  workflow_dispatch:
  push:
    branches:
      - sophisticated-26.3-fabric-port
    paths:
      - .github/workflows/inspect-sophisticated-26.3-api.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: Prepare Minecraft 26.3 classes
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew classes
          jarfile=$(find .gradle/loom-cache/minecraftMaven -name '*.jar' | grep '26.3' | grep -E 'merged|minecraft' | head -n 1)
          echo "JAR=$jarfile"
          echo "===== fuel-related classes ====="
          jar tf "$jarfile" | grep -i Fuel | head -100 || true
          for cls in \
            net.minecraft.world.item.crafting.AbstractCookingRecipe \
            net.minecraft.world.item.crafting.Recipe \
            net.minecraft.world.item.crafting.SingleRecipeInput \
            net.minecraft.world.item.Item \
            net.minecraft.world.item.ItemStack \
            net.minecraft.world.item.ItemStackTemplate \
            net.minecraft.world.ItemStackWithSlot \
            net.minecraft.server.MinecraftServer \
            net.minecraft.server.level.ServerLevel \
            net.minecraft.world.level.Level \
            net.minecraft.world.level.block.entity.FuelValues \
            net.minecraft.world.entity.player.Inventory \
            net.minecraft.world.inventory.AbstractContainerMenu \
            net.minecraft.world.inventory.ContainerSynchronizer \
            net.minecraft.world.inventory.RemoteSlot \
            net.minecraft.world.level.block.entity.BlockEntity \
            net.minecraft.world.level.block.entity.AbstractFurnaceBlockEntity \
            net.minecraft.world.level.storage.ValueInput \
            net.minecraft.world.level.storage.ValueOutput \
            net.minecraft.world.level.dimension.DimensionType \
            net.minecraft.world.item.BucketItem \
            net.minecraft.world.item.crafting.RecipeAccess \
            net.minecraft.world.item.crafting.RecipeManager \
            net.minecraft.world.item.crafting.CustomRecipe \
            net.minecraft.world.item.crafting.ShapedRecipe \
            net.minecraft.world.item.crafting.RecipeSerializer \
            net.minecraft.server.level.ServerPlayer \
            net.minecraft.world.entity.player.Player \
            net.minecraft.nbt.TagParser \
            net.minecraft.world.item.DyeItem \
            net.minecraft.world.entity.player.StackedContents \
            net.minecraft.world.entity.EntityType \
            net.minecraft.resources.ResourceKey \
            net.minecraft.data.recipes.RecipeOutput; do
              echo "===== $cls ====="
              javap -p -classpath "$jarfile" "$cls" || true
          done
