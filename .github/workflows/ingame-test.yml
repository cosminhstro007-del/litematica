name: ingame-litematica-test
on:
  push:
    branches: [ "DEV/26.3" ]

jobs:
  ingame:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: Prepare
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
          chmod +x ./gradlew
          mkdir -p ingame-proof run

      - name: Generate a real 26.3 world
        shell: bash
        run: |
          cat > run/eula.txt <<'EOF'
          eula=true
          EOF

          cat > run/server.properties <<'EOF'
          level-name=saves/LitematicaTest
          online-mode=false
          view-distance=2
          simulation-distance=2
          max-tick-time=0
          spawn-protection=0
          gamemode=creative
          difficulty=peaceful
          EOF

          ./gradlew runServer --stacktrace > ingame-proof/server.out 2>&1 &
          server_pid=$!

          ready=0
          for i in $(seq 1 120); do
            if [ -f run/saves/LitematicaTest/level.dat ] && grep -q "Done (" ingame-proof/server.out 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          test "$ready" -eq 1
          test -f run/saves/LitematicaTest/level.dat

          kill "$server_pid" 2>/dev/null || true
          pkill -f 'KnotServer' 2>/dev/null || true
          sleep 2

      - name: Enter the world with Minecraft client
        shell: bash
        run: |
          cat >> build.gradle <<'EOF'

          loom {
              runs {
                  client {
                      client()
                      programArguments.addAll([
                          "--quickPlaySingleplayer",
                          "LitematicaTest",
                          "--quickPlayPath",
                          "quickplay/log.json"
                      ])
                      println "LOOM_PROGRAM_ARGS=" + programArguments.get()
                  }
              }
          }

          tasks.named("runClient").configure {
              doFirst {
                  println "RUNCLIENT_TASK_ARGS=" + args
              }
          }
          EOF

          Xvfb :99 -screen 0 1280x720x24 +extension GLX +render -noreset > ingame-proof/xvfb.out 2>&1 &
          xvfb_pid=$!
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export MESA_LOADER_DRIVER_OVERRIDE=llvmpipe
          sleep 2

          set +e
          timeout 65s ./gradlew runClient --stacktrace > ingame-proof/client.out 2>&1
          client_code=$?
          set -e

          cp run/logs/latest.log ingame-proof/latest.log || true
          if [ -f run/quickplay/log.json ]; then
            cp run/quickplay/log.json ingame-proof/quickplay-log.json
          fi

          kill "$xvfb_pid" 2>/dev/null || true

          echo "client exit code: $client_code" | tee ingame-proof/result.txt
          grep -E "Loading Minecraft 26\.3|litematica 0\.28\.99-dev|malilib 0\.29\.99-dev|Starting integrated minecraft server|Local game hosted on port|joined the game|Placement Manager calculated thread limit|BlockModelCacheSchematic" ingame-proof/latest.log | tee -a ingame-proof/result.txt || true

          test -f ingame-proof/quickplay-log.json
          grep -Eiq "Starting integrated minecraft server" ingame-proof/latest.log
          grep -Eiq "Local game hosted on port|joined the game" ingame-proof/latest.log
          grep -Eiq "litematica 0\.28\.99-dev" ingame-proof/latest.log
          grep -Eiq "Placement Manager calculated thread limit" ingame-proof/latest.log
          grep -Eiq "BlockModelCacheSchematic: refreshing model cache" ingame-proof/latest.log

      - name: Upload in-game proof
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ingame-proof
          path: ingame-proof/
