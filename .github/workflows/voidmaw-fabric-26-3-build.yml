name: Void Maw Minecraft 26.3 JAR
run-name: Build Void Maw for Fabric 26.3
on:
  workflow_dispatch:
jobs:
  build-voidmaw:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Get isolated Void Maw branch
        uses: actions/checkout@v4
        with:
          ref: voidmaw-fabric-26.3
      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Generate pixel textures
        run: |
          python -m pip install --user Pillow
          python scripts/generate_textures.py
      - name: Build Minecraft mod
        run: gradle --no-daemon clean build --stacktrace
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: VoidMaw-Fabric-26.3
          path: |
            build/libs/voidmaw-fabric-26.3-1.0.0.jar
          if-no-files-found: error
