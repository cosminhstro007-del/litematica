name: Publish verified Tools Beta5 JAR
on:
  push:
    branches: [hephaestus-tools-26.3-beta5-integration]
    paths: ['.github/workflows/publish-tools-beta5.yml']
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Extract previously compiled Beta5 JAR and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fLsS -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/13409214304/zip" \
            -o /tmp/beta5-build.zip
          unzip -tq /tmp/beta5-build.zip
          jar_entry="$(unzip -Z1 /tmp/beta5-build.zip | grep -E '^tools-src/build/libs/[^/]+\.jar$' | grep -v -E 'sources|javadoc' | head -n1)"
          if [ -z "$jar_entry" ]; then unzip -Z1 /tmp/beta5-build.zip; exit 1; fi
          mkdir -p hephaestus-tools-26.3/releases
          unzip -p /tmp/beta5-build.zip "$jar_entry" \
            > hephaestus-tools-26.3/releases/HephaestusTools-26.3-Beta5-Integration.jar
          unzip -tq hephaestus-tools-26.3/releases/HephaestusTools-26.3-Beta5-Integration.jar
          cat > hephaestus-tools-26.3/releases/README-beta5.txt <<'EOF'
          Hephaestus Tools for Minecraft 26.3 NeoForge - unofficial Beta5 integration.
          Original mod: titammods, MIT. Port credited to CosminHstro & FL0X.
          Restores Forge CastingTableRecipe result material component from molten fluid.
          Adds JEI part material variants after material synchronization.
          Retains Beta4 passive repair off by default.
          Requires compatible Player Animation Library. Pair with Forge Alpha2.
          Experimental: manual JEI GUI and multiplayer tests still recommended.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hephaestus-tools-26.3/releases
          git commit -m 'Publish verified Hephaestus Tools 26.3 beta5 JAR'
          git pull --rebase origin hephaestus-tools-26.3-beta5-integration
          git push origin HEAD:hephaestus-tools-26.3-beta5-integration
