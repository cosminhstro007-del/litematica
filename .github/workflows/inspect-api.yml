name: inspect-mc26-renderer
on:
  push:
    branches:
      - DEV/26.3
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: inspect
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew classes
          mkdir -p render-proof
          jarfile=$(find .gradle/loom-cache/minecraftMaven -name '*.jar' | grep '26.3' | grep 'merged' | head -n 1)
          echo "$jarfile" > render-proof/jar.txt
          javap -p -c -classpath "$jarfile" net.minecraft.client.renderer.LevelRenderer > render-proof/LevelRenderer.txt
          javap -p -c -classpath "$jarfile" net.minecraft.client.renderer.chunk.ChunkSectionsToRender > render-proof/ChunkSectionsToRender.txt
          javap -p -c -classpath "$jarfile" net.minecraft.client.renderer.chunk.ChunkSectionLayer > render-proof/ChunkSectionLayer.txt
          javap -p -c -classpath "$jarfile" net.minecraft.client.renderer.RenderPipelines > render-proof/RenderPipelines.txt
          grep -n -A220 -B20 'executeOit\|executeOutline\|executeSolid\|executeClassicTransparency' render-proof/LevelRenderer.txt || true
      - uses: actions/upload-artifact@v6
        with:
          name: render-proof
          path: render-proof/
