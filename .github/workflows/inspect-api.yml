name: inspect-mc26-terrain-details
on:
  push:
    branches:
      - DEV/26.3
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: inspect terrain details
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew classes
          jarfile=$(find .gradle/loom-cache/minecraftMaven -name '*.jar' | grep '26.3' | grep 'merged' | head -n 1)
          for p in assets/minecraft/shaders/include/terrainglobals.glsl assets/minecraft/shaders/include/chunksection.glsl assets/minecraft/shaders/include/globals.glsl; do
            echo "===== $p ====="; unzip -p "$jarfile" "$p" || true; echo
          done
          echo "===== DynamicGpuData ====="
          javap -p -c -classpath "$jarfile" net.minecraft.client.renderer.DynamicGpuData
          echo "===== TerrainTransform ====="
          javap -p -c -classpath "$jarfile" 'net.minecraft.client.renderer.DynamicGpuData$TerrainTransform'
          echo "===== BindGroupLayouts ====="
          javap -p -classpath "$jarfile" net.minecraft.client.renderer.BindGroupLayouts
