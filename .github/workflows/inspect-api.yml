name: inspect-mc26-api
on:
  push:
    branches: [ "DEV/26.3" ]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: Inspect Minecraft client connection API
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew classes
          mkdir -p api-proof
          jarfile=$(find .gradle/loom-cache/minecraftMaven -name '*26.3*.jar' | grep 'minecraft-merged' | head -n 1)
          echo "$jarfile" > api-proof/jar.txt
          javap -p -classpath "$jarfile" net.minecraft.client.gui.screens.ConnectScreen > api-proof/ConnectScreen.txt
          javap -p -classpath "$jarfile" net.minecraft.client.multiplayer.resolver.ServerAddress > api-proof/ServerAddress.txt
          javap -p -classpath "$jarfile" net.minecraft.client.multiplayer.ServerData > api-proof/ServerData.txt
          javap -p -classpath "$jarfile" 'net.minecraft.client.multiplayer.ServerData$Type' > api-proof/ServerDataType.txt
          javap -p -classpath "$jarfile" net.minecraft.client.multiplayer.TransferState > api-proof/TransferState.txt
          javap -p -classpath "$jarfile" net.minecraft.client.Minecraft > api-proof/Minecraft.txt
          cat api-proof/ConnectScreen.txt
          cat api-proof/ServerAddress.txt
          cat api-proof/ServerData.txt
          cat api-proof/ServerDataType.txt
          cat api-proof/TransferState.txt
          echo "=== shader resource candidates ===" > api-proof/shader-list.txt
          jar tf "$jarfile" | grep -E 'assets/minecraft/.+(terrain|chunk|solid|cutout|translucent).+\.(vsh|fsh|glsl)
      - uses: actions/upload-artifact@v6
        with:
          name: api-proof
          path: api-proof/
 >> api-proof/shader-list.txt || true
          jar tf "$jarfile" | grep -E 'assets/minecraft/shaders/.+\.(vsh|fsh|glsl)
      - uses: actions/upload-artifact@v6
        with:
          name: api-proof
          path: api-proof/
 | head -n 300 >> api-proof/shader-list.txt || true
          cat api-proof/shader-list.txt
          mkdir -p api-proof/shaders
          while read -r entry; do
            case "$entry" in
              assets/minecraft/*)
                mkdir -p "api-proof/shaders/$(dirname "$entry")"
                unzip -p "$jarfile" "$entry" > "api-proof/shaders/$entry" || true
                ;;
            esac
          done < api-proof/shader-list.txt
      - uses: actions/upload-artifact@v6
        with:
          name: api-proof
          path: api-proof/
