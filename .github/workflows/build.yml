name: Build Void Maw Fabric 26.3
on:
  push:
    branches: [voidmaw-fabric-26.3]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Build generated textures
        run: |
          python -m pip install --user Pillow
          python scripts/generate_textures.py
      - name: Compile
        run: gradle --no-daemon clean build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: VoidMaw-Fabric-26.3-JAR
          path: build/libs/*-1.0.0.jar
          if-no-files-found: error
