# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [ pull_request, push ]

jobs:
  build:
    strategy:
      matrix:
        java: [ 25 ]
        distro: [ temurin ]
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.distro }}
          java-version: ${{ matrix.java }}

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/dev' }}

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build

      - name: runtime launch smoke test
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          set +e
          timeout 75s xvfb-run -a ./gradlew runClient --stacktrace > runclient.out 2>&1
          code=$?
          set -e
          cat runclient.out
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            echo "runClient exited unexpectedly with code $code"
            exit "$code"
          fi
          test -f run/logs/latest.log
          tail -n 300 run/logs/latest.log
          if grep -Eiq 'Mixin apply failed|Could not execute entrypoint|NoSuchMethodError|NoClassDefFoundError|ExceptionInInitializerError|VerifyError|ModResolutionException' run/logs/latest.log; then
            echo "Fatal mod/runtime error detected"
            exit 1
          fi
          grep -Eiq 'litematica' run/logs/latest.log

      - name: capture runtime log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: runtime-log
          path: |
            run/logs/latest.log
            runclient.out

      - name: capture build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-artifacts
          path: build/libs/
