# Automatically build the project and run a Minecraft client smoke test.
name: build
on: [ pull_request, push ]

jobs:
  build:
    strategy:
      matrix:
        java: [ 25 ]
        distro: [ temurin ]
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.distro }}
          java-version: ${{ matrix.java }}

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/dev' }}

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build

      - name: runtime launch smoke test
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
          Xvfb :99 -screen 0 1280x720x24 +extension GLX +render -noreset > xvfb.out 2>&1 &
          xvfb_pid=$!
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export MESA_LOADER_DRIVER_OVERRIDE=llvmpipe
          sleep 2
          glxinfo -B | tee glxinfo.out

          set +e
          timeout 60s ./gradlew runClient --stacktrace > runclient.out 2>&1
          code=$?
          set -e
          kill "$xvfb_pid" 2>/dev/null || true

          cat runclient.out
          test -f run/logs/latest.log
          tail -n 400 run/logs/latest.log

          if [ "$code" -ne 124 ]; then
            echo "Minecraft client did not remain running until the smoke-test timeout (exit $code)"
            exit 1
          fi

          if grep -Eiq 'Mixin apply failed|Could not execute entrypoint|NoSuchMethodError|NoClassDefFoundError|ExceptionInInitializerError|VerifyError|ModResolutionException|Crash report saved' run/logs/latest.log; then
            echo "Fatal mod/client startup error detected"
            exit 1
          fi

          grep -Eiq 'Loading Minecraft 26\.3' run/logs/latest.log
          grep -Eiq 'litematica 0\.28\.99-dev' run/logs/latest.log
          grep -Eiq 'malilib 0\.29\.99-dev' run/logs/latest.log
          grep -Eiq 'Using graphics backend (OpenGL|Vulkan)' run/logs/latest.log
          grep -Eiq 'Created window using SDL video driver' run/logs/latest.log
          grep -Eiq 'Placement Manager calculated thread limit' run/logs/latest.log
          grep -Eiq 'BlockModelCacheSchematic: refreshing model cache' run/logs/latest.log

      - name: capture runtime log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: runtime-log
          path: |
            run/logs/latest.log
            runclient.out
            glxinfo.out
            xvfb.out

      - name: capture build artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-artifacts
          path: build/libs/
