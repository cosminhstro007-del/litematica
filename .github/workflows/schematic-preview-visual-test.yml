name: schematic-preview-visual-test
on:
  push:
    branches: [ "DEV/26.3" ]
  workflow_dispatch:

jobs:
  preview-visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: Prepare headless graphics
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers openbox imagemagick
          chmod +x ./gradlew
          mkdir -p proof run
          printf 'eula=true\n' > run/eula.txt
          cat > run/server.properties <<'EOF'
          gamemode=creative
          difficulty=peaceful
          view-distance=4
          simulation-distance=4
          online-mode=false
          spawn-protection=0
          EOF

      - name: Generate 26.3 test world
        shell: bash
        run: |
          set +e
          timeout 70s ./gradlew runServer --args="nogui" > proof/server.out 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            cat proof/server.out
            exit "$code"
          fi
          test -f run/world/level.dat
          mkdir -p run/saves
          rm -rf run/saves/world
          cp -a run/world run/saves/world

      - name: Inject temporary schematic preview verifier
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("src/main/java/fi/dy/masa/litematica/scheduler/ClientTickHandler.java"); s=p.read_text(); marker="            SelectionManager sm = DataManager.getSelectionManager();"; assert marker in s; s=s.replace(marker, "            PreviewCiHelper.tick(mc);\n\n" + marker, 1); p.write_text(s)'
          printf '%s' '' | base64 -d > src/main/java/fi/dy/masa/litematica/scheduler/PreviewCiHelper.java
          # Minecraft 26.3 renamed/removed the old RedStoneWireBlock symbol used only by this CI helper.
          sed -i '/import net.minecraft.world.level.block.RedStoneWireBlock;/d' src/main/java/fi/dy/masa/litematica/scheduler/PreviewCiHelper.java
          sed -i 's/Blocks.REDSTONE_WIRE.defaultBlockState().setValue(RedStoneWireBlock.POWER, 15)/Blocks.REDSTONE_WIRE.defaultBlockState()/g' src/main/java/fi/dy/masa/litematica/scheduler/PreviewCiHelper.java

          cat >> build.gradle <<'EOF'

          loom {
              runs {
                  client {
                      programArguments.add("--quickPlaySingleplayer")
                      programArguments.add("world")
                      programArguments.add("--quickPlayPath")
                      programArguments.add("quickplay.json")
                      systemProperties.put("litematica.ci.preview", "true")
                  }
              }
          }
          EOF

      - name: Compile injected preview verifier
        shell: bash
        run: ./gradlew compileJava --stacktrace

      - name: Render schematic preview and capture screenshot
        shell: bash
        run: |
          Xvfb :99 -screen 0 1280x720x24 +extension GLX +render -noreset > proof/xvfb.out 2>&1 &
          xvfb_pid=$!
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export MESA_LOADER_DRIVER_OVERRIDE=llvmpipe

          openbox --sm-disable > proof/openbox.out 2>&1 &
          openbox_pid=$!
          sleep 2

          ./gradlew runClient > proof/client.out 2>&1 &
          client_pid=$!

          ready=0
          for i in $(seq 1 150); do
            if grep -Fq "[CI-PREVIEW] READY_FOR_SCREENSHOT" run/logs/latest.log 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$client_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          cp run/logs/latest.log proof/latest.log 2>/dev/null || true
          tail -n 500 proof/latest.log || true

          if [ "$ready" -ne 1 ]; then
            echo "Preview scene never became ready"
            kill "$client_pid" "$openbox_pid" "$xvfb_pid" 2>/dev/null || true
            exit 2
          fi

          sleep 5
          import -display :99 -window root proof/schematic-preview.png
          identify proof/schematic-preview.png

          kill "$client_pid" "$openbox_pid" "$xvfb_pid" 2>/dev/null || true

          grep -Fq "[CI-PREVIEW] Created test schematic" proof/latest.log
          grep -Fq "[CI-PREVIEW] Schematic world state at origin: Block{minecraft:stone}" proof/latest.log
          test -s proof/schematic-preview.png

      - name: Upload preview proof
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: schematic-preview-visual-proof
          path: proof/
