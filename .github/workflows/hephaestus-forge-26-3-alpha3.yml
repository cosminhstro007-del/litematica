name: Hephaestus Forge 26.3 alpha3 stability
on:
  push:
    branches:
      - hephaestus-forge-26.3-alpha3-stability
    paths:
      - 'hephaestus-forge-26.3/**'
      - '!hephaestus-forge-26.3/releases/**'
      - '.github/workflows/hephaestus-forge-26-3-alpha3.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated port scripts
        uses: actions/checkout@v4
      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Retrieve original Hephaestus Forge 1.0.20
        shell: bash
        run: |
          git clone --depth 1 --branch '26.1/main' https://github.com/titammods/hephaestusforge.git forge-src
          git -C forge-src rev-parse HEAD | tee original-forge-revision.txt
          python3 hephaestus-forge-26.3/port_forge.py forge-src
          python3 hephaestus-forge-26.3/legacy_bridge.py forge-src
          python3 hephaestus-forge-26.3/fix_26_3_apis.py forge-src
          python3 hephaestus-forge-26.3/fix_generated_data.py forge-src
          python3 hephaestus-forge-26.3/fix_jei_refresh.py forge-src
          python3 hephaestus-forge-26.3/fix_save_and_buckets.py forge-src
          cp forge-src/LICENSE forge-src/src/main/resources/LICENSE-hephaestusforge.txt
          java -version
      - name: Compile complete source on NeoForge 26.3
        shell: bash
        run: |
          set -o pipefail
          cd forge-src
          chmod +x gradlew
          ./gradlew --no-daemon build --stacktrace 2>&1 | tee ../forge-build.log
      - name: Inject developer-only gameplay validation into dev run
        shell: bash
        run: |
          python3 hephaestus-forge-26.3/inject_smoke_test.py forge-src
      - name: Test Forge and JEI recipe integration with Tools Beta5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p forge-src/run/mods
          for attempt in $(seq 1 35); do
            if curl -fLsS \
              "https://raw.githubusercontent.com/cosminhstro007-del/litematica/hephaestus-tools-26.3-beta5-integration/hephaestus-tools-26.3/releases/HephaestusTools-26.3-Beta5-Integration.jar" \
              -o forge-src/run/mods/HephaestusTools-26.3-Beta5-Integration.jar; then
              break
            fi
            if [ "$attempt" -eq 35 ]; then echo "Tools Beta5 JAR unavailable"; exit 1; fi
            sleep 8
          done
          unzip -tq forge-src/run/mods/HephaestusTools-26.3-Beta5-Integration.jar
          python3 hephaestus-forge-26.3/audit_integrity.py forge-src forge-src/run/mods/HephaestusTools-26.3-Beta5-Integration.jar
          python3 hephaestus-forge-26.3/inject_alpha3_tests.py forge-src
          printf 'eula=true\n' > forge-src/run/eula.txt
          printf 'online-mode=false\n' > forge-src/run/server.properties
          cd forge-src
          timeout 90s ./gradlew --no-daemon runServer 2>&1 | tee ../forge-server.log || rc=$?
          if ! grep -q 'HEPHAESTUS_VERIFY_SUCCESS recipes, table, basin, melter' ../forge-server.log; then
            echo "Forge verification failed: actual recipes or smelting/casting did not complete."
            grep -E 'HEPHAESTUS_VERIFY|Exception|ERROR|FATAL' ../forge-server.log | tail -45 || true
            exit 1
          fi
          if ! grep -q 'HEPHAESTUS_ALPHA3 fluid dirty notifications + no changes on simulation OK' ../forge-server.log; then
            echo "Smeltery legacy fluid notifications regression check failed"; exit 1
          fi
          if ! grep -q 'HEPHAESTUS_ALPHA3 bucket insert/extract and menu idempotent close OK' ../forge-server.log; then
            echo "Smeltery GUI bucket regression check failed"; exit 1
          fi
          if ! grep -q 'HEPHAESTUS_INTEGRITY Tools material integration PASS' ../forge-server.log; then
            echo "Tools Beta5 cross-mod casting regression detected"; exit 1
          fi
          if ! grep -E 'Done \([0-9.]+s\)!' ../forge-server.log; then
            echo "Forge+Tools failed to reach server ready phase."
            exit 1
          fi
      - name: Publish experimental Forge JAR
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hephaestus-forge-26.3/releases
          jar_file="$(find forge-src/build/libs -maxdepth 1 -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' -print -quit)"
          test -s "$jar_file"
          cp "$jar_file" hephaestus-forge-26.3/releases/HephaestusForge-26.3-Alpha3-Stability.jar
          unzip -tq hephaestus-forge-26.3/releases/HephaestusForge-26.3-Alpha3-Stability.jar
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hephaestus-forge-26.3/releases
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Hephaestus Forge 26.3 Alpha3 with saved-fluid and bucket fixes'
            git pull --rebase origin hephaestus-forge-26.3-alpha3-stability
            git push origin HEAD:hephaestus-forge-26.3-alpha3-stability
          fi
      - name: Archive build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hephaestus-forge-26-3-build
          retention-days: 7
          if-no-files-found: warn
          path: |
            original-forge-revision.txt
            forge-build.log
            forge-server.log
            forge-src/build/libs/*.jar
