name: schematic-preview-26.3-test
on:
  push:
    branches: [ "DEV/26.3" ]
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v5

      - name: Install software renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libvulkan1 mesa-vulkan-drivers
          chmod +x ./gradlew

      - name: Run real schematic preview client test
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          SDL_VIDEODRIVER: x11
        run: |
          xvfb-run -a ./gradlew runClientGameTest --no-daemon -Pschematic_preview_test

      - name: Upload visual proof
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: litematica-26.3-preview-proof
          path: |
            build/run/**/screenshots/**
            build/run/**/logs/latest.log
            build/run/**/crash-reports/**
            run/**/screenshots/**
            run/**/logs/latest.log
            run/**/crash-reports/**
          if-no-files-found: warn
